trigger: none
parameters:
  - name: WEB_APP
    displayName: Select Test
    type: string
    default: FMS
    values:
      - FMS
      - Member Site
      - Blue Sky
      - Marketing Site

variables:
  - group: qa-automation
  - name: BUILD_ID
    value: $(Build.BuildId)
  - name: WEB_APP
    value: ${{ parameters.WEB_APP }}
  # Parameter → flow file. Add one block per new value of TEST.
  - ${{ if eq(parameters.WEB_APP, 'FMS') }}:
      - name: FLOW_PATH
        value: tests/fms/production_smoke.md

stages:
  - stage:
    pool: ado-agents-pool

    jobs:
      - job:
        timeoutInMinutes: 30
        steps:
          # Self-hosted agents keep their workspace between runs.
          - checkout: self
            clean: true
          - task: Bash@3
            displayName: 'Install uv'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                if ! command -v uv >/dev/null 2>&1; then
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                fi
                echo "##vso[task.prependpath]$HOME/.local/bin"
                uv --version

          - task: Bash@3
            displayName: 'Install dependencies and Chromium'
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                # uv reads .python-version and downloads Python 3.14 when the VM lacks it.
                # --no-build: install wheels only, so a dependency without a 3.14 wheel
                # fails here instead of trying to compile it on the agent.
                uv sync --locked --no-build
                uv run python --version
                # Chromium's system libraries need root; without passwordless sudo they
                # must be installed once per VM: sudo .venv/bin/playwright install-deps chromium
                if sudo -n true 2>/dev/null; then
                  uv run playwright install --with-deps chromium
                else
                  uv run playwright install chromium
                fi
              workingDirectory: '$(Build.SourcesDirectory)'

          - task: Bash@3
            displayName: 'Running Tests'
            timeoutInMinutes: 20
            inputs:
              targetType: 'inline'
              script: |
                echo "Selected Production Test: ${{ parameters.WEB_APP }} ($(FLOW_PATH))"
                # pytest exit 1 = the run completed but a test case failed: mark the step
                # "succeeded with issues" (orange) and leave the details to the Tests tab.
                # Any other non-zero code (interrupted, internal/usage error, nothing
                # collected) means the run itself broke and fails the step.
                set +e
                uv run pytest "$(FLOW_PATH)"
                code=$?
                if [ $code -eq 1 ]; then
                  echo "##vso[task.logissue type=warning]Some test cases failed — see the Tests tab"
                  echo "##vso[task.complete result=SucceededWithIssues;]"
                  exit 0
                fi
                exit $code
              workingDirectory: '$(Build.SourcesDirectory)'
              failOnStderr: false
            env:
              BUILD_NAME: '${{ parameters.WEB_APP }} Production Smoke #$(BUILD_ID)'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              # one result per test case (flow section), the same count as summary.json
              testResultsFiles: 'reports/*/junit.xml'
              searchFolder: '$(Build.SourcesDirectory)'
              testRunTitle: '${{ parameters.WEB_APP }} Production Smoke'

          # - task: PublishPipelineArtifact@1
          #   displayName: 'Publish HTML report'
          #   condition: always()
          #   inputs:
          #     targetPath: '$(Build.SourcesDirectory)/reports/production'
          #     artifact: 'report-${{ parameters.WEB_APP }}-$(BUILD_ID)'
          
          - task: Bash@3
            displayName: 'After Run'
            condition: always()
            inputs:
              targetType: 'filePath'
              filePath: 'after_run.sh'
