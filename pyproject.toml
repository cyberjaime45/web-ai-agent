[project]
name = "web-agent"
version = "1.5.0"          # the Web Agent version; janus-extension.toml repeats it (test_banner checks)
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic==0.40.0",
    "google-genai==3.1.0",
    "markdown-it-py==4.3.0",
    "openai==3.49.0",
    "pillow>=13.0.0",
    "playwright==1.65.0",
    "pymysql>=1.1.0",
    "pytest==9.2.0",
    "python-dotenv==1.2.4",
    "selectolax>=1.0.2",
]

[project.optional-dependencies]
# The Web Agent MCP (mcp_server/): `uv sync --extra mcp`. Not needed to run flows.
mcp = [
    "mcp>=1.12,<2",
]
