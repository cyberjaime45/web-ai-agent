# The framework's own tests (tests/_framework) on every push to staging and every pull request.
# The flows under tests/<app>/ open real sites and stay with azure_pipelines.yml; they never run here.
# No lint step: the project has no ruff configuration yet.
name: CI

on:
  push:
    branches: [staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request replaces its run; runs on the main line always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true            # the Python version comes from .python-version
      - name: Install (the lockfile must match pyproject.toml; the mcp extra for the MCP server's tests)
        run: uv sync --locked --extra mcp
      # The browser only: the runner image already carries Chromium's system libraries, and --with-deps adds
      # font packages whose download fails on it. The *_browser tests skip when Chromium cannot start, so the
      # next step proves it does, and a broken browser fails the job instead of quietly skipping them.
      - name: Install Chromium
        run: uv run --no-sync playwright install chromium
      - name: Check that Chromium starts
        run: |
          uv run --no-sync python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              print("chromium", browser.version)
              browser.close()
          PY
      - name: Test
        run: uv run --no-sync pytest tests/_framework
